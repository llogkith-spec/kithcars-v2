<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims desk | KITH Cars Accident Management</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, clear, reassuring — someone just had a crash; plain words, one thing at a time
   IDEA: a claims handler's clipboard — one question card at a time, the finished claim form at the end
   PICTURE: the working questionnaire itself, then the filled claim form laid out like the paper original
   COLOUR and TYPE: white ground, road-ink charcoal, warning-triangle red accent; Archivo 800 + Archivo
   LAYOUT: one 720px column; step strip on top, question card, sticky Back/Next bar */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111315);--ink:light-dark(#15181c,#eef0f2);--mute:light-dark(#5d636b,#a3a9b0);
--line:light-dark(#dcdfe3,#2c3136);--soft:light-dark(#f3f4f6,#1a1d20);--acc:light-dark(#c8202b,#ff5a62);
--accInk:#fff;--ok:light-dark(#1b7a45,#5fd395);--card:light-dark(#ffffff,#16191c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
.top{background:#111315;color:#fff;padding:18px max(5vw,16px) 26px}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:15px;color:#fff;text-decoration:none}
.brand img{height:64px;width:auto;flex:none}
.brand span{padding-left:14px;border-left:1px solid rgba(255,255,255,.35);line-height:1.2}
.top h1{font:800 clamp(28px,5vw,42px)/1.05 Archivo,sans-serif;margin:14px 0 8px;text-wrap:balance;max-width:720px}
.top p{margin:0;max-width:620px;opacity:.85}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:thin}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:8px 14px;font:500 14px Archivo,sans-serif;cursor:pointer;min-height:40px}
.steps button.done{color:var(--ink)}
.steps button.done::before{content:"✓ ";color:var(--ok)}
.steps button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode{display:flex;align-items:center;gap:6px;padding-top:16px;font-size:14px;color:var(--mute)}.mode span{margin-right:4px}.mode button{font:500 14px Archivo,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer}.mode button.on{border-color:var(--acc);color:var(--acc)}
footer{max-width:720px;margin:0 auto;padding:0 16px 110px;font-size:13px;color:var(--mute)}
.bar{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
h2{font:800 30px/1.1 Archivo,sans-serif;margin:26px 0 6px}
.stage{margin:22px 0 -14px;font-size:14px;color:var(--mute)}.stage b{color:var(--acc)}
.lede{color:var(--mute);margin:0 0 18px}
.q{padding:18px 0;border-top:1px solid var(--line)}
.q>label,.q>.lab{display:block;font-weight:600;margin-bottom:8px}
.req{color:var(--acc)}
.help{display:block;color:var(--mute);font-size:14px;margin:-4px 0 8px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;font:16px Archivo,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:110px;resize:vertical}
::placeholder{color:var(--mute);opacity:.6}
.photos{margin:0 0 16px;padding:12px 14px 12px 36px;background:var(--soft);border-radius:10px;font-size:15px}.photos li{padding:3px 0}
.langask{display:flex;align-items:center;gap:10px;width:100%;margin:4px 0 6px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:500 15px Archivo,sans-serif;cursor:pointer;min-height:48px;text-align:start}
.langask u{color:var(--acc);text-underline-offset:3px}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible,.pill input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px;border-color:var(--acc)}
.short{max-width:220px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.pill input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{font:800 18px Archivo,sans-serif;margin:24px 0 0;padding-top:16px;border-top:2px solid var(--ink)}
.err input,.err textarea,.err select,.err .pill span{border-color:var(--acc)}
.errmsg{color:var(--acc);font-size:14px;margin-top:6px}
.note{background:var(--soft);border-left:4px solid var(--acc);padding:12px 14px;border-radius:6px;margin-top:10px;font-size:15px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.check input{width:24px;height:24px;flex:none;margin:3px 0 0;accent-color:var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px max(16px,calc((100vw - 720px)/2))}
.nav .in{display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:600 16px Archivo,sans-serif;border-radius:10px;padding:12px 22px;min-height:48px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn[hidden]{display:none}
.saved{font-size:13px;color:var(--mute)}
/* review / claim form */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.status{font-size:14px;color:var(--mute);min-height:20px}
.sheet{border:1.5px solid var(--ink);border-radius:4px;background:var(--card)}
.sheet .hd{padding:16px 18px;border-bottom:1.5px solid var(--ink)}
.sheet .hd b{font:800 22px Archivo,sans-serif;display:block}
.sheet .hd span{color:var(--mute);font-size:14px}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{display:flex;justify-content:space-between;align-items:center;margin:0;padding:10px 18px;background:var(--soft);font:800 15px Archivo,sans-serif}
.sec h3 button{font:500 14px Archivo,sans-serif;background:none;border:0;color:var(--acc);cursor:pointer;min-height:36px;padding:0 4px}
table{width:100%;border-collapse:collapse}
td{padding:8px 18px;vertical-align:top;border-top:1px solid var(--line);font-size:15px}
tr:first-child td{border-top:0}
td:first-child{width:42%;color:var(--mute)}
td.blank{color:var(--mute);opacity:.6}
td.v{white-space:pre-wrap;overflow-wrap:anywhere}
.miss{font-size:14px;margin:0 0 12px;color:var(--mute)}
.small{font-size:13px;color:var(--mute);margin-top:14px}
@media(max-width:600px){td{display:block;width:auto!important;padding:2px 18px}td:first-child{padding-top:10px;font-size:13px}tr td:last-child{padding-bottom:10px}tr:first-child td{border-top:0}tr td+td{border-top:0}h2{font-size:26px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

function parseMsg(text){

  if(m=line.match(/^\*(.+)\*$/)){const i=CSTEPS.findIndex(s=>s.h===m[1].trim());if(i>=0){step=i;sub=null}continue}

 const inbox=fetch(INBOX,{method:'POST',headers:{'Content-Type':'application/json',apikey:INKEY,Authorization:'Bearer '+INKEY,'x-caller':'kithcars_accident_claim'},
  body:JSON.stringify({channel:'website',sender_name:d.ownName||'',sender_phone:d.ownTel||'',reg,message_text:'Accident claim (non-fault) from kithcars.com/accident-claim\n\n'+m})})
  .then(r=>r.ok?'sent':'failed').catch(()=>'failed');
 const [e,i]=await Promise.all([email,inbox]);
 return {email:e,inbox:i,ok:e==='sent'||i==='sent'};
}

function plain(){
 return 'VEHICLE COLLISION CLAIM FORM\nPrepared by KITH Cars (Kith Cars Ltd), '+new Date().toLocaleDateString('en-GB')+'\n\n'+
  sections().map(([h,rows])=>h.toUpperCase()+'\n'+rows.map(r=>`${r[0]}: ${val(r)||'—'}`).join('\n')).join('\n\n');
}

function qv(k){
 const u=x=>g(x).toUpperCase();
 const X={xDrvName:dv('ownName','drvName'),xDrv1:dv('own1','drv1'),xDrv2:dv('own2','drv2'),xDrv3:dv('own3','drv3'),xDrv4:dv('own4','drv4'),xDrvPC:dv('ownPC','drvPC'),xDrvTel:dv('ownTel','drvTel'),xDrvAlt:dv('ownAlt','drvAlt'),xDrvEmail:dv('ownEmail','drvEmail'),xWa:()=>same()?(g('wa')||(g('ownPref')==='WhatsApp'?'Yes':'')):g('drvWa'),
  xDob:()=>fd(g('dob')),xNi:()=>u('ni'),xReg:()=>u('reg'),xWhen:()=>fd(g('when')),xPolStart:()=>fd(g('polStart')),xPolEnd:()=>fd(g('polEnd')),xTpReg:()=>u('tpReg')};
 const v=X[k]?X[k]():g(k);
 return /PC$/.test(k)?String(v).toUpperCase():String(v);
}
async function makeDocx(){
 const z=await JSZip.loadAsync(QDOS_TPL,{base64:true});
 let x=await z.file('word/document.xml').async('string');
 x=x.replace(/<w:t(?: [^>]*)?>([^<]*)<\/w:t>/g,(m,inner)=>{
  if(!inner.includes('{{'))return m;
  const out=inner.replace(/\{\{([A-Za-z0-9]+)(?:=([^}]+))?\}\}/g,(mm,k,opt)=>{
   if(opt!==undefined)return (qv(k)===opt?'\u2612 ':'\u2610 ')+opt;
   return xe(qv(k)).replace(/\n/g,'</w:t><w:br/><w:t xml:space="preserve">');
  });
  return '<w:t xml:space="preserve">'+out+'</w:t>';
 });
 x=x.split('<w:trPr/>').join('<w:trPr><w:cantSplit/></w:trPr>');
 x=x.replace(/<w:trPr>(?!<w:cantSplit\/>)/g,'<w:trPr><w:cantSplit/>');
 x=x.replace(/(<w:tr(?: [^>]*)?>)(?!<w:trPr)/g,'$1<w:trPr><w:cantSplit/></w:trPr>');
 z.file('word/document.xml',x);
 return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

let downloads=null;
if(window.claude&&claude.use)claude.use('downloads').then(x=>{downloads=x;if(STEPS[cur].review)render()}).catch(()=>{});

let clrArm=false;
$('form').addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go){if(all){cur=0;save();render();$('s'+b.dataset.go)?.scrollIntoView({block:'start'})}else go(+b.dataset.go);return}
 const st=$('st');
 if(b.id==='cp'){try{await navigator.clipboard.writeText(MODE==='staff'?plain():msg());st.textContent='Copied — paste it into an email or message.'}catch(err){st.textContent=MODE==='staff'?'Copy was blocked here — use the Word download instead.':'Copy was blocked here — use the WhatsApp or email button instead.'}}
 if(b.id==='sub'){
  b.disabled=true;b.textContent='Submitting…';st.textContent='';
  const r=await submitClaim();
  if(r.ok){try{localStorage.setItem('kith-claim-sent',new Date().toISOString())}catch(x){}
   try{if(window.dataLayer)window.dataLayer.push({event:'generate_lead',form:'accident-claim'})}catch(x){}
   b.textContent='Claim submitted ✓';st.textContent='We’ve got your claim. Now send your photos below.';
   const w=$('waPhotos');if(w)w.classList.add('main');}
  else{b.disabled=false;b.textContent='Submit my claim';st.textContent='That didn’t send. Please try again, or use “Send your answers on WhatsApp” below.'}
  return}
 if(b.id==='impBtn'){const nd=parseMsg($('imp').value),n=Object.keys(nd).length;if(!n){$('impSt').textContent='No answers found — paste the whole message, starting from “KITH Cars accident claim”.';return}d=nd;save();go(STEPS.length-1);return}
 if(b.id==='dl'){
  if(typeof JSZip==='undefined'){st.textContent='Downloading isn’t available in this view — use Copy as text instead.';return}
  st.textContent='Preparing the file…';
  try{const blob=await makeDocx();const name=`Qdos claim form ${(g('reg')||'').toUpperCase()} ${g('ownName')}`.replace(/[^\w \-]/g,'').replace(/\s+/g,' ').trim()||'Claim form';
   if(downloads){await downloads.save({filename:name+'.docx',data:blob})}
   else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+'.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
   st.textContent='Saved — check your downloads.'}
  catch(err){st.textContent=err&&err.code==='declined'?'Download cancelled.':'Couldn’t save the file — try Copy as text.'}
 }
 if(b.id==='clr'){if(!clrArm){clrArm=true;b.textContent='Tap again to clear all answers';setTimeout(()=>{clrArm=false;if(b.isConnected)b.textContent='Start a new claim'},4000);return}
  d={};clrArm=false;try{localStorage.removeItem('kith-claim');localStorage.removeItem('kith-claim-sent')}catch(err){}go(0)}
});
$('form').addEventListener('input',e=>{
 const t=e.target;if(!t.name)return;
 d[t.name]=t.type==='checkbox'?t.checked:t.value;save();
 const q=STEPS.flatMap(x=>x.q).find(x=>x.k===t.name);
 if(t.type==='radio'||t.tagName==='SELECT'){const y=window.scrollY;render();window.scrollTo(0,y)}
 const el=t.closest('.q');if(el&&q&&q.req&&d[q.k]){el.classList.remove('err');el.querySelector('.errmsg')?.remove()}
});
$('form').addEventListener('submit',e=>e.preventDefault());
$('steps').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.j!==undefined){$('s'+b.dataset.j)?.scrollIntoView({block:'start'});return}go(+b.dataset.i)});
const setMode=a=>{all=a;try{localStorage.setItem('kith-claim-mode',a?'all':'step')}catch(e){}if(STEPS[cur].review&&a)cur=0;render();window.scrollTo({top:0})};
$('mStep').addEventListener('click',()=>setMode(false));$('mAll').addEventListener('click',()=>setMode(true));
$('back').addEventListener('click',()=>go(all&&STEPS[cur].review?0:cur-1));
$('next').addEventListener('click',()=>{if(validate())go(all?STEPS.length-1:cur+1)});
if(cur>=STEPS.length)cur=0;
if(MODE==='staff'){try{const h=location.hash||'';if(h.indexOf('#claim=')===0){const nd=parseMsg(b64d(h.slice(7)));if(Object.keys(nd).length){d=nd;save();cur=STEPS.length-1;all=false}
 try{history.replaceState(null,'',location.pathname)}catch(e){}}}catch(e){}}
render();
if(MODE==='staff'&&STEPS[cur].review&&$('st')&&!$('st').textContent)$('st').textContent='Check it over, then press Download filled Qdos claim form.';
}
